[package]
name = "sequoia-side"
version = "0.1.0"
edition = "2021"
publish = false
description = "Interop harness: the independent RFC 9980 implementation. See ../README.md"

[dependencies]
# `crypto-rust` is the pure-Rust backend: no nettle, no OpenSSL, no system
# packages, so this builds anywhere cargo does. Sequoia calls it experimental
# and requires `allow-experimental-crypto` to opt in — see the caveat in
# ../README.md. That flag is acceptable *here* and nowhere near the app: this
# binary is a test counterparty, never shipped.
sequoia-openpgp = { version = "2.4", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
] }
serde_json = "1"
