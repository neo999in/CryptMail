plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.cryptmail'
version = '0.1.0'

android {
  namespace "app.cryptmail.core"

  defaultConfig {
    // The Rust core is built for arm64 only (see core/README.md). Listing it
    // explicitly means a build for another ABI fails at assembly time rather
    // than at the first crypto call on a device.
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  sourceSets {
    main {
      // Where `cargo ndk -o …/jniLibs` puts libcryptmail_core.so, and where
      // `uniffi-bindgen --out-dir` puts the generated Kotlin.
      jniLibs.srcDirs += ['../../../android/app/src/main/jniLibs']
    }
  }
}

dependencies {
  // UniFFI's generated Kotlin binds through JNA.
  implementation 'net.java.dev.jna:jna:5.14.0@aar'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
